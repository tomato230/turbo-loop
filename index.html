<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Turbo Loop</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Russo+One&family=Barlow:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0c0e13; --panel: #151a24; --panel2: #1d2432; --line: rgba(255,255,255,.09);
    --text: #f4f5f7; --dim: #97a1b3; --accent: #ffcc00; --red: #e63946; --good: #2ec4b6;
    --display: "Russo One", "Arial Black", Impact, sans-serif; --ui: "Barlow", "Helvetica Neue", Arial, sans-serif;
  }
  html, body { margin: 0; height: 100%; background: var(--bg); overflow: hidden; color: var(--text); font-family: var(--ui); }
  canvas#c { display: block; width: 100vw; height: 100vh; }
  .screen { position: fixed; inset: 0; display: none; align-items: center; justify-content: center; padding: 16px; box-sizing: border-box; overflow: auto;
    background: radial-gradient(ellipse at 30% 20%, rgba(230,57,70,.18), transparent 60%), linear-gradient(180deg, rgba(8,10,14,.55), rgba(8,10,14,.85)); }
  .screen.on { display: flex; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 26px; width: min(560px, 100%); box-sizing: border-box; margin: auto;
    box-shadow: 0 30px 80px rgba(0,0,0,.55); position: relative; overflow: hidden; }
  .card::before { content: ""; position: absolute; left: 0; right: 0; top: 0; height: 6px;
    background: repeating-conic-gradient(#fff 0 25%, #111 0 50%) 0 0 / 12px 12px; opacity: .9; }
  .card.wide { width: min(920px, 100%); }
  .logo { text-align: center; margin: 6px 0 2px; font-family: var(--display); font-style: italic; line-height: .9; transform: skewX(-8deg); user-select: none; }
  .logo b { display: block; font-size: clamp(54px, 11vw, 96px); color: var(--accent); letter-spacing: 2px;
    text-shadow: 4px 4px 0 var(--red), 8px 8px 0 rgba(0,0,0,.35); }
  .logo i { display: inline-block; font-style: normal; font-size: clamp(20px, 4vw, 30px); color: #111; background: var(--text); padding: 2px 14px; margin-top: 10px; letter-spacing: 8px; }
  .tag { text-align: center; color: var(--dim); margin: 14px 0 18px; font-weight: 600; font-size: 17px; }
  h2 { font-family: var(--display); font-weight: 400; font-style: italic; margin: 6px 0 16px; font-size: 28px; letter-spacing: .5px; }
  .btn { display: flex; align-items: center; gap: 12px; width: 100%; padding: 14px 18px; margin: 10px 0; border: 0; border-radius: 3px; cursor: pointer;
    background: var(--panel2); color: var(--text); font: 700 19px var(--ui); letter-spacing: .3px; text-align: left; transform: skewX(-8deg);
    border-left: 5px solid transparent; transition: transform .12s, background .12s, border-color .12s; box-sizing: border-box; }
  .btn > * { transform: skewX(8deg); }
  .btn:hover:not(:disabled) { background: #263044; border-left-color: var(--accent); transform: skewX(-8deg) translateX(4px); }
  .btn.primary { background: var(--accent); color: #141414; justify-content: center; font-family: var(--display); font-weight: 400; font-size: 22px; letter-spacing: 1px; }
  .btn.primary:hover:not(:disabled) { background: #ffd83d; border-left-color: var(--red); }
  .btn:disabled { opacity: .4; cursor: not-allowed; }
  .btn .ico { font-size: 22px; width: 28px; text-align: center; }
  .btn small { display: block; color: var(--dim); font-weight: 500; font-size: 14px; }
  .row { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
  .row .btn { flex: 1; }
  .topbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
  .coins { font-family: var(--display); color: var(--accent); font-size: 18px; white-space: nowrap; }
  .swatches { display: flex; flex-wrap: wrap; gap: 10px; }
  .swatch { width: 40px; height: 40px; border-radius: 50%; border: 3px solid transparent; cursor: pointer; position: relative; box-sizing: border-box; }
  .swatch.sel { border-color: #fff; box-shadow: 0 0 0 3px var(--accent); }
  .lock { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font: 700 11px var(--ui); color: #fff; background: rgba(0,0,0,.55); border-radius: 50%; }
  .opts { display: flex; gap: 10px; flex-wrap: wrap; }
  .opt { flex: 1; min-width: 120px; padding: 12px; border-radius: 3px; border: 2px solid var(--line); background: var(--panel2); color: #fff; font: 700 17px var(--ui); cursor: pointer; text-align: center; }
  .opt.sel { border-color: var(--accent); }
  .opt small { display: block; color: var(--dim); margin-top: 3px; font-weight: 500; font-size: 13px; }
  input[type=text], select { width: 100%; box-sizing: border-box; padding: 12px 14px; border-radius: 3px; border: 1px solid var(--line); background: #0f131b; color: #fff; font: 600 17px var(--ui); }
  label { display: block; margin: 16px 0 7px; color: var(--dim); font-size: 13px; font-weight: 700; letter-spacing: 1.5px; text-transform: uppercase; }
  .check { display: flex; align-items: center; gap: 8px; text-transform: none; letter-spacing: 0; font-size: 16px; color: var(--text); }
  .tracks { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 14px; }
  .track { border: 2px solid var(--line); border-radius: 4px; padding: 10px; cursor: pointer; background: var(--panel2); transition: transform .12s, border-color .12s; }
  .track:hover { transform: translateY(-3px); }
  .track.sel { border-color: var(--accent); }
  .track canvas { width: 100%; height: auto; border-radius: 3px; display: block; }
  .track b { display: block; margin-top: 10px; font-family: var(--display); font-weight: 400; font-size: 18px; }
  .small { font-size: 14px; color: var(--dim); }
  .code { word-break: break-all; background: #0f131b; padding: 12px; border-radius: 3px; font: 600 14px var(--ui); user-select: all; border: 1px dashed rgba(255,204,0,.35); }
  .buybar { margin-top: 14px; padding: 12px 14px; border-radius: 3px; background: rgba(255,204,0,.1); border-left: 4px solid var(--accent); display: none; }
  .buybar.on { display: flex; }
  #preview { width: 100%; height: 150px; border-radius: 3px; display: block; }
  .status { margin: 14px 0 6px; padding: 12px 14px; border-radius: 3px; background: var(--panel2); font-weight: 600; border-left: 4px solid var(--good); }
  .slots { display: grid; gap: 8px; margin-top: 8px; }
  .slot { display: flex; align-items: center; gap: 12px; padding: 10px 14px; background: var(--panel2); border-radius: 3px; font-weight: 700; font-size: 17px; }
  .slot .dot { width: 18px; height: 18px; border-radius: 50%; border: 2px solid rgba(0,0,0,.4); }
  .slot.empty { color: var(--dim); font-weight: 500; font-style: italic; }
  .slot .badge { margin-left: auto; font-size: 12px; letter-spacing: 1.5px; padding: 3px 8px; border-radius: 2px; background: var(--accent); color: #111; }
  .slot .badge.you { background: var(--good); }
  .hint { text-align: center; font-size: 13px; color: var(--dim); margin-top: 18px; line-height: 1.7; }
  kbd { font: 700 12px var(--ui); background: var(--panel2); border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 3px; padding: 1px 6px; color: var(--text); }
</style>
</head>
<body>
<canvas id="c"></canvas>

<div class="screen" id="scrMenu"><div class="card">
  <div class="topbar"><span class="small" id="helloName"></span><span class="coins">🪙 <span class="coinCount">0</span></span></div>
  <div class="logo"><b>TURBO</b><i>LOOP</i></div>
  <p class="tag" id="tagline">Brakes are optional.</p>
  <button class="btn primary" data-go="scrTracks"><span>RACE THE AI</span></button>
  <button class="btn" data-go="scrOnline"><span class="ico">🌐</span><span>Race friends online<small>Up to 4 players · send a link</small></span></button>
  <button class="btn" data-go="scrGarage"><span class="ico">🔧</span><span>Garage<small>Paint job, body style, name</small></span></button>
  <p class="hint"><kbd>↑</kbd><kbd>W</kbd> gas · <kbd>↓</kbd><kbd>S</kbd> brake · <kbd>←</kbd><kbd>→</kbd> steer · <kbd>Space</kbd> drift · <kbd>R</kbd> respawn · <kbd>M</kbd> sound · <kbd>Q</kbd> menu<br>Version 2.1</p>
</div></div>

<div class="screen" id="scrTracks"><div class="card wide">
  <div class="topbar"><h2>Pick your circuit</h2><span class="coins">🪙 <span class="coinCount">0</span></span></div>
  <div class="tracks" id="trackList"></div>
  <div class="row" style="margin-top:10px">
    <button class="btn" data-go="scrMenu"><span>← Back</span></button>
    <button class="btn primary" id="btnRace"><span>LIGHTS OUT ▶</span></button>
  </div>
</div></div>

<div class="screen" id="scrGarage"><div class="card">
  <div class="topbar"><h2>Garage</h2><span class="coins">🪙 <span class="coinCount">0</span></span></div>
  <canvas id="preview" width="520" height="150"></canvas>
  <label for="inName">Driver name</label>
  <input type="text" id="inName" maxlength="10" autocomplete="off">
  <label>Paint</label>
  <div class="swatches" id="swatches"></div>
  <label>Body</label>
  <div class="opts" id="styles"></div>
  <label class="check"><input type="checkbox" id="inStripe"> Racing stripe</label>
  <div class="buybar row" id="buyBar">
    <span id="buyText" style="flex:1;font-weight:600"></span>
    <button class="btn primary" id="btnBuy" style="width:auto;margin:0;padding:10px 18px"><span>BUY</span></button>
  </div>
  <button class="btn" data-go="scrMenu" style="margin-top:18px"><span>← Back to menu</span></button>
</div></div>

<div class="screen" id="scrOnline"><div class="card">
  <div class="topbar"><h2>Online race</h2><span class="coins">🪙 <span class="coinCount">0</span></span></div>
  <div id="onStart">
    <button class="btn primary" id="btnHost"><span>CREATE A ROOM</span></button>
    <label for="inJoin">Or join a friend — paste their link or room code</label>
    <div class="row"><input type="text" id="inJoin" placeholder="link or room code" style="flex:3"><button class="btn" id="btnJoin" style="flex:1;margin:0;justify-content:center"><span>Join</span></button></div>
  </div>
  <div id="onRoom" style="display:none">
    <div id="hostShare">
      <label>Send this link to up to 3 friends</label>
      <div class="code" id="shareLink">…</div>
      <button class="btn" id="btnCopy" style="justify-content:center"><span>📋 Copy link</span></button>
      <p class="small" id="fileNote" style="display:none">Friends can also paste just the room code: <b id="roomCode"></b></p>
    </div>
    <div class="status" id="netStatus">Connecting…</div>
    <label>Drivers</label>
    <div class="slots" id="slots"></div>
    <div id="hostControls" style="display:none">
      <div class="row">
        <div style="flex:1;min-width:160px"><label for="selTrack">Track</label><select id="selTrack"></select></div>
        <div style="flex:1;min-width:160px"><label for="selBet">Bet per driver</label><select id="selBet"></select></div>
      </div>
      <button class="btn primary" id="btnStartOnline" style="margin-top:18px"><span>LIGHTS OUT ▶</span></button>
    </div>
    <p class="small" id="guestInfo" style="display:none;margin-top:14px"></p>
  </div>
  <button class="btn" id="btnLeave" style="margin-top:14px"><span>← Leave</span></button>
</div></div>

<script>
// Turbo Loop 2.0: top-down arcade racer. Solo vs 3 AI, or up to 4 players online (host relays everyone's positions).
const cv = document.getElementById('c'), g = cv.getContext('2d');
let W = 0, H = 0, DPR = 1;
function resize() {
  DPR = Math.min(2, window.devicePixelRatio || 1);
  W = window.innerWidth; H = window.innerHeight;
  cv.width = W * DPR; cv.height = H * DPR;
}
addEventListener('resize', resize); resize();

const LAPS = 3, HALF_W = 95, WORLD_W = 3600, WORLD_H = 2700, MAX = 560, SECTORS = 8, MAX_PLAYERS = 4;
const FONT = '"Barlow", "Helvetica Neue", Arial, sans-serif', DFONT = '"Russo One", "Arial Black", Impact, sans-serif';
const $ = id => document.getElementById(id);
const ME = Math.random().toString(36).slice(2, 10);

// ---------- save data (browser storage; the game works without it) ----------
const COLORS = [
  { id: 'yellow', c: '#ffd23f' }, { id: 'red', c: '#ee4266' }, { id: 'teal', c: '#3bceac' }, { id: 'blue', c: '#5b8def' },
  { id: 'orange', c: '#ff8c42' }, { id: 'purple', c: '#9b5de5' }, { id: 'white', c: '#f1f1f1' }, { id: 'black', c: '#2a2a2e' },
  { id: 'gold', c: '#e8b923', price: 250 }, { id: 'neon', c: '#39ff14', price: 250 }, { id: 'pink', c: '#ff4fd8', price: 250 },
];
const STYLES = [
  { id: 'sport', name: 'Sport', price: 0 }, { id: 'muscle', name: 'Muscle', price: 300 }, { id: 'f1', name: 'Formula', price: 600 },
];
const SAVE_KEY = 'turboLoop.v2';
function loadSave() {
  let s = null;
  try { s = JSON.parse(localStorage.getItem(SAVE_KEY)); } catch (e) {}
  s = Object.assign({ name: 'YOU', color: 'yellow', style: 'sport', stripe: true, coins: 150, owned: [], best: {}, track: 'green' }, s || {});
  try { const old = parseFloat(localStorage.getItem('turboLoopBestLap')); if (old && !s.best.green) s.best.green = old; } catch (e) {}
  return s;
}
let save = loadSave();
function persist() { try { localStorage.setItem(SAVE_KEY, JSON.stringify(save)); } catch (e) {} refreshCoins(); }
const colorOf = id => (COLORS.find(c => c.id === id) || COLORS[0]).c;
const priceOf = id => (COLORS.find(c => c.id === id) || STYLES.find(s => s.id === id) || {}).price || 0;
const owns = id => !priceOf(id) || save.owned.includes(id);
function stripeFor(hex) {
  const n = parseInt(hex.slice(1), 16), l = ((n >> 16) * .3 + ((n >> 8) & 255) * .59 + (n & 255) * .11);
  return l > 150 ? '#1b1b1b' : '#ffffff';
}
function myProfile() { return { name: save.name || 'YOU', body: colorOf(save.color), style: save.style, stripeOn: save.stripe }; }


// ---------- tracks ----------
const TRACKS = [
  { id: 'green', name: 'Green Loop', desc: 'Classic countryside circuit',
    ctrl: [[420,1350],[480,720],[820,380],[1450,400],[1780,760],[2150,520],[2850,430],[3270,760],[3250,1380],[2850,1680],[2330,1540],[1950,1820],[2150,2230],[1560,2400],[920,2260],[560,1960]],
    theme: { grass: '#3f8f3a', blobs: ['20,70,20', '120,170,80'], run: '#c9b27c', curbA: '#d7263d', curbB: '#ffffff', asphalt: '#4a4e57', asphalt2: '#51555f', line: 'rgba(255,255,255,.55)', deco: 'tree' } },
  { id: 'desert', name: 'Desert Dunes', desc: 'Fast straights, a tight hook',
    ctrl: [[520,520],[1500,380],[2600,450],[3150,800],[3120,1300],[2550,1420],[2150,1230],[1720,1450],[2000,1900],[2880,1980],[3120,2330],[2300,2450],[1100,2400],[520,2100],[360,1400]],
    theme: { grass: '#e2c28a', blobs: ['190,150,90', '245,215,160'], run: '#d9a866', curbA: '#ff8c42', curbB: '#ffffff', asphalt: '#5a5550', asphalt2: '#625c56', line: 'rgba(255,240,200,.6)', deco: 'cactus' } },
  { id: 'snow', name: 'Snow Peak', desc: 'Twisty mountain pass',
    ctrl: [[600,600],[1300,450],[1720,800],[1520,1300],[1900,1660],[2500,1360],[2700,720],[3200,600],[3300,1300],[3000,2200],[2200,2400],[1300,2300],[700,2150],[450,1500]],
    theme: { grass: '#e9f1f7', blobs: ['190,210,230', '255,255,255'], run: '#b8c8d8', curbA: '#2d6cdf', curbB: '#ffffff', asphalt: '#565d6b', asphalt2: '#5d6573', line: 'rgba(255,255,255,.7)', deco: 'pine' } },
  { id: 'city', name: 'Night City', desc: 'Neon streets after dark',
    ctrl: [[520,460],[1800,460],[2030,720],[2030,1100],[2320,1310],[3080,1310],[3250,1620],[3100,2250],[2000,2300],[1700,2060],[1300,2110],[900,2300],[460,2100],[450,1300]],
    theme: { grass: '#1b1f2a', blobs: ['40,46,62', '28,32,44'], run: '#2a3040', curbA: '#ff2e88', curbB: '#20e3ff', asphalt: '#2e323c', asphalt2: '#343844', line: 'rgba(255,230,120,.7)', deco: 'building', night: true } },
];
const trackById = id => TRACKS.find(t => t.id === id) || TRACKS[0];

function catmull(p0, p1, p2, p3, t) {
  const t2 = t * t, t3 = t2 * t;
  return [0, 1].map(k => 0.5 * ((2 * p1[k]) + (-p0[k] + p2[k]) * t + (2 * p0[k] - 5 * p1[k] + 4 * p2[k] - p3[k]) * t2 + (-p0[k] + 3 * p1[k] - 3 * p2[k] + p3[k]) * t3));
}
function buildGeometry(t) {
  if (t.PTS) return t;
  const C = t.ctrl, n = C.length, p = k => C[(k + n) % n], dense = [];
  for (let i = 0; i < n; i++) for (let s = 0; s < 60; s++) dense.push(catmull(p(i - 1), p(i), p(i + 1), p(i + 2), s / 60));
  const P = [dense[0]], step = 8; let acc = 0;
  for (let i = 1; i <= dense.length; i++) {
    const a = dense[i - 1], b = dense[i % dense.length], seg = Math.hypot(b[0] - a[0], b[1] - a[1]); let t0 = 0;
    while (acc + seg * (1 - t0) >= step) { const tt = t0 + (step - acc) / seg; P.push([a[0] + (b[0] - a[0]) * tt, a[1] + (b[1] - a[1]) * tt]); t0 = tt; acc = 0; }
    acc += seg * (1 - t0);
  }
  if (Math.hypot(P.at(-1)[0] - P[0][0], P.at(-1)[1] - P[0][1]) < step * .5) P.pop();
  t.PTS = P; t.N = P.length;
  t.TAN = P.map((q, i) => { const a = P[(i + 1) % P.length], b = P[(i - 1 + P.length) % P.length]; return Math.atan2(a[1] - b[1], a[0] - b[0]); });
  // minimap
  const mw = 210, mh = 158, sc = Math.min((mw - 20) / WORLD_W, (mh - 20) / WORLD_H), m = document.createElement('canvas');
  m.width = mw; m.height = mh; const x = m.getContext('2d');
  x.fillStyle = 'rgba(12,16,24,.72)'; x.beginPath(); x.roundRect(0, 0, mw, mh, 14); x.fill();
  x.beginPath(); P.forEach((q, i) => i ? x.lineTo(10 + q[0] * sc, 10 + q[1] * sc) : x.moveTo(10 + q[0] * sc, 10 + q[1] * sc)); x.closePath();
  x.lineWidth = 7; x.strokeStyle = 'rgba(255,255,255,.85)'; x.lineJoin = 'round'; x.stroke();
  const s0 = P[0]; x.fillStyle = t.theme.curbA; x.beginPath(); x.arc(10 + s0[0] * sc, 10 + s0[1] * sc, 4, 0, 7); x.fill();
  t.mini = m; t.mmScale = sc;
  return t;
}
TRACKS.forEach(buildGeometry);

let TR = TRACKS[0];
const at = i => TR.PTS[((i % TR.N) + TR.N) % TR.N];
const tanAt = i => TR.TAN[((i % TR.N) + TR.N) % TR.N];
function nearestIndex(x, y, guess, t = TR) {
  const N = t.N; let best = guess, bd = Infinity;
  const from = guess == null ? 0 : guess - 45, to = guess == null ? N : guess + 45;
  for (let i = from; i < to; i++) {
    const q = t.PTS[((i % N) + N) % N], d = (q[0] - x) ** 2 + (q[1] - y) ** 2;
    if (d < bd) { bd = d; best = ((i % N) + N) % N; }
  }
  return [best, Math.sqrt(bd)];
}

// Paint a track's world once; only the current track's big canvas is kept in memory.
function paintWorld(t) {
  if (t.world) return;
  TRACKS.forEach(o => { if (o !== t) o.world = null; });
  const th = t.theme, world = document.createElement('canvas'); world.width = WORLD_W; world.height = WORLD_H;
  const w = world.getContext('2d');
  w.fillStyle = th.grass; w.fillRect(0, 0, WORLD_W, WORLD_H);
  for (let x = 0; x < WORLD_W; x += 120) { w.fillStyle = (x / 120) % 2 ? 'rgba(255,255,255,.035)' : 'rgba(0,0,0,.03)'; w.fillRect(x, 0, 120, WORLD_H); }
  let seed = t.id.length * 97 + 7; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
  for (let i = 0; i < 900; i++) { w.fillStyle = `rgba(${th.blobs[rnd() < .5 ? 0 : 1]},.22)`; w.beginPath(); w.arc(rnd() * WORLD_W, rnd() * WORLD_H, 6 + rnd() * 26, 0, 7); w.fill(); }

  const P = t.PTS, path = () => { w.beginPath(); P.forEach((q, i) => i ? w.lineTo(q[0], q[1]) : w.moveTo(q[0], q[1])); w.closePath(); };
  w.lineJoin = 'round'; w.lineCap = 'round';
  path(); w.lineWidth = HALF_W * 2 + 70; w.strokeStyle = th.run; w.stroke();
  path(); w.lineWidth = HALF_W * 2 + 22; w.strokeStyle = th.curbA; w.stroke();
  path(); w.setLineDash([34, 34]); w.strokeStyle = th.curbB; w.stroke(); w.setLineDash([]);
  path(); w.lineWidth = HALF_W * 2; w.strokeStyle = th.asphalt; w.stroke();
  path(); w.lineWidth = HALF_W * 2 - 30; w.strokeStyle = th.asphalt2; w.stroke();
  path(); w.lineWidth = 4; w.setLineDash([40, 50]); w.strokeStyle = th.line; w.stroke(); w.setLineDash([]);

  const s0 = P[0], a0 = t.TAN[0], nx = -Math.sin(a0), ny = Math.cos(a0);
  w.save(); w.translate(s0[0], s0[1]); w.rotate(a0);
  for (let r = 0; r < 2; r++) for (let k = -HALF_W; k < HALF_W; k += 16) { w.fillStyle = ((k + HALF_W) / 16 + r) % 2 ? '#111' : '#fff'; w.fillRect(-16 + r * 16, k, 16, 16); }
  w.restore();

  // street lights for the night track
  if (th.night) for (let i = 0; i < t.N; i += 45) for (const side of [-1, 1]) {

// ---------- cars ----------

  }
  if (state === 'race' && !cars[0].done && (cars[0].dist || 0) > RESPAWN_DIST) {
    slab(W / 2 - 200, H - 92, 400, 50, '#ffcc00'); text('Lost in the grass? Press R to get back', W / 2, H - 67, 18, '#fff', 'center');
  }
  if (state === 'race' && cars[0].done && mode === 'online') { slab(W / 2 - 220, 20, 440, 50, '#2ec4b6'); text(`Finished! Waiting for the others… ${Math.max(0, 45 - Math.floor(finishWait))}s`, W / 2, 45, 17, '#fff', 'center'); }
  if (state === 'paused') { overlay(.55); text('PAUSED', W / 2, H / 2, 70, '#fff', 'center', 'd'); text('P continue · R restart · Q menu', W / 2, H / 2 + 56, 18, '#fff', 'center'); }
  if (state === 'finished') {
    overlay(Math.min(.65, tState * 1.2));
    const me = cars[0], place = results.indexOf(me) + 1, top = Math.max(20, H / 2 - 210);
    const [head, sub] = place === 1 ? [WIN_LINES[Math.floor(raceTime) % 3], 'You crossed the line first 🏆'] : LOSE_LINES[Math.min(place, 4)];
    text(head, W / 2, top + 24, 60, place === 1 ? '#ffcc00' : '#fff', 'center', 'd');
    text(sub, W / 2, top + 70, 20, 'rgba(255,255,255,.8)', 'center');
    const medals = ['🥇', '🥈', '🥉', ''];
    results.forEach((c, i) => {
      const y = top + 110 + i * 44;
      slab(W / 2 - 240, y, 480, 38, c.body);
      text(medals[i] || `${i + 1}.`, W / 2 - 210, y + 19, 22, '#fff', 'left');
      text(c.local ? `${c.name} (you)` : c.name, W / 2 - 170, y + 19, 20, c.local ? '#ffcc00' : '#fff');
      text(c.done ? fmt(c.finishTime) : c.left ? 'DNF' : 'racing…', W / 2 + 200, y + 19, 20, 'rgba(255,255,255,.9)', 'right', 'd');
    });
    const y = top + 130 + results.length * 44;
    text(`Best lap ${fmt(Math.min(...me.laps))}${newBest ? '  ·  NEW RECORD!' : ''}`, W / 2, y, 18, '#ffcc00', 'center');
    text(`🪙 ${coinDelta >= 0 ? '+' : ''}${coinDelta} coins  (${coinNotes.join(', ')})  ·  total ${save.coins}`, W / 2, y + 32, 18, '#fff', 'center');
    const hint = mode === 'solo' ? 'ENTER race again  ·  Q menu' : net.isHost ? (net.guests.size ? 'ENTER rematch  ·  Q back to lobby' : 'Q back to lobby') : 'Waiting for the host to start a rematch…  ·  Q back to lobby';
    text(hint, W / 2, y + 78, 19, '#fff', 'center');
  }
}
function render() {
  g.setTransform(DPR, 0, 0, DPR, 0, 0);
  if (!TR.world) paintWorld(TR);
  g.fillStyle = TR.theme.grass; g.fillRect(0, 0, W, H);
  const zoom = Math.max(.55, Math.min(1.1, Math.min(W / 1400, H / 850)));
  let camX, camY;
  if (state === 'menu') { const q = TR.PTS[Math.floor(performance.now() / 40) % TR.N]; camX = q[0]; camY = q[1]; }
  else { const me = cars[0]; camX = me.x + me.vx * .35; camY = me.y + me.vy * .35; }
  g.save(); g.translate(W / 2, H / 2); g.scale(zoom, zoom); g.translate(-camX, -camY);
  g.drawImage(TR.world, 0, 0);
  for (const s of skids) { g.fillStyle = `rgba(20,20,20,${.35 * s.life})`; g.fillRect(s.x - 2.5, s.y - 2.5, 5, 5); }
  for (const p of dust) { g.fillStyle = `rgba(160,130,80,${.5 * p.life})`; g.beginPath(); g.arc(p.x, p.y, 8 + (1 - p.life) * 14, 0, 7); g.fill(); }
  if (state !== 'menu') for (const c of cars) drawCar(c);
  g.restore();
  if (TR.theme.night && state !== 'menu') { const v = g.createRadialGradient(W / 2, H / 2, H * .3, W / 2, H / 2, H); v.addColorStop(0, 'rgba(0,0,0,0)'); v.addColorStop(1, 'rgba(0,0,10,.45)'); g.fillStyle = v; g.fillRect(0, 0, W, H); }
  if (state !== 'menu') { drawHUD(); drawScreens(); }
}

// ---------- menus ----------
const SCREENS = ['scrMenu', 'scrTracks', 'scrGarage', 'scrOnline'];
const TAGLINES = ['Brakes are optional.', 'Drift now, apologize later.', 'Pedal to the metal.', 'Second place is the first loser.', 'Corners are just suggestions.', 'Fuel: attitude.'];
function showScreen(id) {
  SCREENS.forEach(s => $(s).classList.toggle('on', s === id));
  if (id) state = 'menu';
  if (id === 'scrMenu') { $('tagline').textContent = TAGLINES[Math.floor(Math.random() * TAGLINES.length)]; $('helloName').textContent = `Driver: ${save.name}`; }
  if (id === 'scrTracks') renderTrackList();
  if (id === 'scrGarage') renderGarage();
  if (id === 'scrOnline') renderSlots();
  refreshCoins();
}
function toMenu() {
  cars = [];
  if (mode === 'online' && (net.isHost || net.hostConn)) { showScreen('scrOnline'); updateLobby(); }
  else { if (mode === 'online') netReset(); showScreen('scrMenu'); }
}
function refreshCoins() { document.querySelectorAll('.coinCount').forEach(e => e.textContent = save.coins); }
document.querySelectorAll('[data-go]').forEach(b => b.addEventListener('click', () => showScreen(b.dataset.go)));

function trackCard(t, sel) {
  const d = document.createElement('div'); d.className = 'track' + (sel ? ' sel' : '');
  const c = document.createElement('canvas'); c.width = 210; c.height = 158;
  const x = c.getContext('2d'); x.fillStyle = t.theme.grass; x.fillRect(0, 0, 210, 158); x.drawImage(t.mini, 0, 0);
  d.appendChild(c);
  d.insertAdjacentHTML('beforeend', `<b>${t.name}</b><span class="small">${t.desc}<br>Best lap: ${fmt(save.best[t.id])}</span>`);
  return d;
}
function renderTrackList() {
  const list = $('trackList'); list.innerHTML = '';
  TRACKS.forEach(t => { const d = trackCard(t, t.id === save.track); d.onclick = () => { save.track = t.id; persist(); renderTrackList(); TR = t; }; list.appendChild(d); });
  TR = trackById(save.track);
}
$('btnRace').onclick = () => startRace({ mode: 'solo', trackId: save.track });

let pendingBuy = null;
function renderGarage() {
  $('inName').value = save.name; $('inStripe').checked = save.stripe;
  $('swatches').innerHTML = '';
  COLORS.forEach(c => {
    const s = document.createElement('div'); s.className = 'swatch' + (save.color === c.id ? ' sel' : ''); s.style.background = c.c; s.title = c.id;
    if (!owns(c.id)) s.innerHTML = `<span class="lock">🔒${c.price}</span>`;
    s.onclick = () => pick(c.id, 'color'); $('swatches').appendChild(s);
  });
  $('styles').innerHTML = '';
  STYLES.forEach(st => {
    const b = document.createElement('button'); b.className = 'opt' + (save.style === st.id ? ' sel' : '');
    b.innerHTML = `${st.name}<small>${owns(st.id) ? 'owned' : '🔒 ' + st.price + ' coins'}</small>`;
    b.onclick = () => pick(st.id, 'style'); $('styles').appendChild(b);
  });
  $('buyBar').classList.toggle('on', !!pendingBuy);
}
function pick(id, kind) {
  if (owns(id)) { save[kind] = id; pendingBuy = null; persist(); renderGarage(); return; }
  pendingBuy = { id, kind };
  const price = priceOf(id), can = save.coins >= price;
  $('buyText').textContent = can ? `Unlock ${id} for 🪙 ${price}?` : `${id} costs 🪙 ${price} — you have ${save.coins}. Win some races!`;
  $('btnBuy').disabled = !can; renderGarage();
}
$('btnBuy').onclick = () => {
  if (!pendingBuy) return;
  const price = priceOf(pendingBuy.id); if (save.coins < price) return;
  save.coins -= price; save.owned.push(pendingBuy.id); save[pendingBuy.kind] = pendingBuy.id; pendingBuy = null; persist(); renderGarage();
};
$('inName').oninput = e => { save.name = e.target.value.trim().slice(0, 10) || 'YOU'; persist(); };
$('inStripe').onchange = e => { save.stripe = e.target.checked; persist(); };
function drawPreview() {
  const pc = $('preview'), x = pc.getContext('2d'), p = myProfile();
  const gr = x.createLinearGradient(0, 0, 0, pc.height); gr.addColorStop(0, '#1d2432'); gr.addColorStop(1, '#0f131b');
  x.fillStyle = gr; x.fillRect(0, 0, pc.width, pc.height);
  x.fillStyle = 'rgba(255,204,0,.08)'; for (let i = 0; i < 12; i++) x.fillRect(i * 50 - ((performance.now() / 8) % 50), 108, 26, 4);
  x.save(); x.translate(pc.width / 2, pc.height / 2 + 6); x.scale(2.7, 2.7); x.rotate(Math.sin(performance.now() / 900) * .22);
  drawCarShape(x, { body: p.body, style: p.style, stripe: p.stripeOn ? stripeFor(p.body) : null });
  x.restore();
  x.font = `24px ${DFONT}`; x.fillStyle = '#fff'; x.textAlign = 'center'; x.fillText(save.name || 'YOU', pc.width / 2, 32);
}

$('btnHost').onclick = hostRoom;
$('btnJoin').onclick = () => joinRoom($('inJoin').value);
$('btnCopy').onclick = () => { try { navigator.clipboard.writeText($('shareLink').textContent); $('btnCopy').firstElementChild.textContent = '✅ Copied!'; setTimeout(() => $('btnCopy').firstElementChild.textContent = '📋 Copy link', 1500); } catch (e) {} };
$('btnLeave').onclick = () => { netReset(); showScreen('scrMenu'); };
$('btnStartOnline').onclick = hostStart;
$('selTrack').innerHTML = TRACKS.map(t => `<option value="${t.id}">${t.name}</option>`).join('');
$('selTrack').onchange = e => { net.lobby.track = e.target.value; broadcastRoster(); };
$('selBet').onchange = e => { net.lobby.stake = +e.target.value; broadcastRoster(); };

// ---------- main loop ----------
let last = performance.now();
function loop(now) {
  const dt = Math.min(1 / 20, (now - last) / 1000); last = now;
  if (window.innerWidth !== W || window.innerHeight !== H) resize();
  if (state !== 'paused' && state !== 'menu') update(dt);
  if (state === 'menu' && $('scrGarage').classList.contains('on')) drawPreview();
  render();
  requestAnimationFrame(loop);
}
TR = trackById(save.track);
const joinParam = new URLSearchParams(location.search).get('join');
if (joinParam) { showScreen('scrOnline'); joinRoom(joinParam); } else showScreen('scrMenu');
requestAnimationFrame(loop);
</script>
</body>
